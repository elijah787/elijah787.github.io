<!DOCTYPE html>
<html>
<head>
    <meta charset="UTF-8">
    <title>Jeans Club - Personalized Notifications</title>
    <style>
        body { background: #0a0a0a; color: #00ff00; font-family: monospace; padding: 20px; }
        pre { background: #1a1a1a; padding: 15px; border-radius: 5px; overflow-x: auto; font-size: 12px; }
        .stats { background: #1a1a1a; padding: 10px; border-radius: 5px; margin: 10px 0; }
    </style>
</head>
<body>
    <h1>Ì±ñ Jeans Club - Personalized Notifications</h1>
    <div class="stats" id="stats">Loading member data from Supabase...</div>
    <pre id="log">Starting...</pre>

    <script>
    const SUPABASE_URL = 'https://uoyzsyxjrfygrsfzhlao.supabase.co';
    const SUPABASE_ANON_KEY = 'eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6InVveXpzeXhqcmZ5Z3JzZnpobGFvIiwicm9sZSI6ImFub24iLCJpYXQiOjE3NjQxMDA0OTAsImV4cCI6MjA3OTY3NjQ5MH0.XOVNKt2JoLsjakjarq_wdt-PQKBI-8HpyBZmQZpznac';
    
    const ONESIGNAL_APP_ID = '40cfbe3f-800c-4105-b3aa-ca32676332b0';
    // TRY BOTH API KEYS - USE THE KEY DIRECTLY (NOT BASE64 ENCODED)
    const ONESIGNAL_API_KEY = 'mnauelxvguqlmnyogt55cfj6u';
    
    const logElement = document.getElementById('log');
    const statsElement = document.getElementById('stats');
    
    function addLog(msg, isError = false) {
        const timestamp = new Date().toLocaleString();
        const color = isError ? '#ff4444' : '#00ff00';
        logElement.innerHTML += `<div style="color: ${color};">[${timestamp}] ${msg}</div>`;
        logElement.scrollTop = logElement.scrollHeight;
        console.log(msg);
    }
    
    // Generate PERSONALIZED message based on member data
    function generatePersonalizedMessage(member) {
        const name = member.name.split(' ')[0];
        const points = member.points || 0;
        const totalSpent = member.total_spent || 0;
        const tier = member.tier || 'PEARL';
        const daysInactive = member.last_login ? Math.floor((Date.now() - new Date(member.last_login)) / (1000 * 60 * 60 * 24)) : 999;
        
        // TIER-BASED SARCASM
        const tierMessages = {
            'PLATINUM': `Ì±ë Oh look, ${name} the PLATINUM has arrived! Your highness, care to buy more jeans?`,
            'SAPPHIRE': `Ì≤é ${name}, you're SAPPHIRE! Fancy way of saying "spends too much on jeans."`,
            'GOLD': `Ìµá ${name} is GOLD! Not Olympic gold, just "broke-but-stylish" gold.`,
            'RUBY': `‚ù§Ô∏è ${name} hit RUBY! Your wallet is bleeding, but you look good.`,
            'SILVER': `Ìµà ${name}, you're SILVER. Getting there... slowly.`,
            'BRONZE': `Ìµâ ${name} is BRONZE! Participation trophy energy. Step it up!`,
            'PEARL': `Ì∂™ ${name}, you're a PEARL. Just a fancy rock. Spend more!`
        };
        
        // POINTS-BASED TEASING
        let pointsMessage = '';
        if (points >= 500) {
            pointsMessage = `Ì≤∞ HOARDER! ${name} has ${points} points. Spend them before we donate them!`;
        } else if (points >= 200) {
            pointsMessage = `Ì≤∏ ${name} has ${points} points. ${points * 50} UGX discount. Not bad.`;
        } else if (points >= 50) {
            pointsMessage = `‚ö†Ô∏è ${name}, you have ${points} points. Cute. Almost enough to buy something.`;
        } else if (points < 50 && points > 0) {
            pointsMessage = `Ì¥° ${name} has ${points} points. Embarrassing. The circus is disappointed.`;
        } else {
            pointsMessage = `Ì≤Ä ${name} has ZERO points. We're not mad, just disappointed.`;
        }
        
        // SPENDING-BASED ROASTING
        let spendingMessage = '';
        if (totalSpent >= 1000000) {
            spendingMessage = `Ì≤∞ MILLIONAIRE! ${name} spent ${(totalSpent/1000).toFixed(0)}K UGX. Your wallet is crying!`;
        } else if (totalSpent >= 500000) {
            spendingMessage = `Ì≤™ ${name} spent ${(totalSpent/1000).toFixed(0)}K UGX. Respectable.`;
        } else if (totalSpent >= 100000) {
            spendingMessage = `Ì≥â ${name} spent ${(totalSpent/1000).toFixed(0)}K UGX. Rookie numbers.`;
        } else if (totalSpent > 0) {
            spendingMessage = `Ì∂ê ${name} spent only ${(totalSpent/1000).toFixed(0)}K UGX. Shrimp change.`;
        } else {
            spendingMessage = `ÌΩø ${name} spent ZERO. Are you even a member? Buy something!`;
        }
        
        // INACTIVITY SHAMING
        let inactivityMessage = '';
        if (daysInactive > 60) {
            inactivityMessage = `Ì≤Ä ${name}, ${daysInactive} days! We thought you died. Come back!`;
        } else if (daysInactive > 30) {
            inactivityMessage = `Ì±ª ${name}, ${daysInactive} days? Ghosting us? Your jeans miss you.`;
        } else if (daysInactive > 14) {
            inactivityMessage = `‚è∞ ${name}, ${daysInactive} days. Your style is getting dusty.`;
        }
        
        // Combine messages
        let finalMessage = '';
        if (daysInactive > 30) {
            finalMessage = inactivityMessage;
        } else if (points === 0 && totalSpent === 0) {
            finalMessage = `Ì¥° HEY ${name.toUpperCase()}! You joined and did NOTHING. Buy jeans or else! Ì±ñ`;
        } else if (totalSpent >= 1000000) {
            finalMessage = `${tierMessages[tier]} ${spendingMessage}`;
        } else if (points >= 200) {
            finalMessage = `${pointsMessage} ${tierMessages[tier]}`;
        } else {
            finalMessage = `${spendingMessage} ${pointsMessage}`;
        }
        
        return {
            title: getTitleForMember(member, points, totalSpent),
            body: finalMessage.substring(0, 200)
        };
    }
    
    function getTitleForMember(member, points, totalSpent) {
        const name = member.name.split(' ')[0];
        if (member.tier === 'PLATINUM') return `ÔøΩÔøΩ PLATINUM: ${name}`;
        if (totalSpent >= 1000000) return `Ì≤∞ MILLIONAIRE: ${name}`;
        if (points >= 500) return `Ì≤é HOARDER: ${name}`;
        if (points === 0 && totalSpent === 0) return `Ì¥° DO SOMETHING: ${name}`;
        if (points < 50) return `‚ö†Ô∏è BROKE: ${name}`;
        return `Ì≤Ä ${name}, we need to talk`;
    }
    
    async function sendToOneSignal(externalUserId, title, body) {
        try {
            // METHOD 1: Using 'key' authentication (old format)
            addLog(`   Attempting to send via OneSignal API...`);
            
            const response = await fetch('https://onesignal.com/api/v1/notifications', {
                method: 'POST',
                headers: {
                    'Content-Type': 'application/json',
                    'Authorization': `Key ${ONESIGNAL_API_KEY}`
                },
                body: JSON.stringify({
                    app_id: ONESIGNAL_APP_ID,
                    headings: { en: title },
                    contents: { en: body },
                    include_external_user_ids: [externalUserId],
                    priority: 10,
                    ttl: 86400
                })
            });
            
            const result = await response.json();
            addLog(`   Response: ${JSON.stringify(result)}`);
            return result;
            
        } catch (error) {
            addLog(`   Error: ${error.message}`, true);
            return null;
        }
    }
    
    async function sendPersonalizedNotifications() {
        addLog('ÌæØ Fetching members from Supabase...');
        
        try {
            const response = await fetch(`${SUPABASE_URL}/rest/v1/members?select=*`, {
                headers: {
                    'apikey': SUPABASE_ANON_KEY,
                    'Authorization': `Bearer ${SUPABASE_ANON_KEY}`
                }
            });
            
            const members = await response.json();
            addLog(`Ì≥ä Found ${members.length} members in Supabase`);
            
            let sentCount = 0;
            let failCount = 0;
            
            for (const member of members) {
                if (member.push_enabled !== true) {
                    addLog(`‚è≠Ô∏è Skipping ${member.name} (push not enabled)`);
                    continue;
                }
                
                const { title, body } = generatePersonalizedMessage(member);
                addLog(`Ì≥§ Sending to ${member.name} (${member.jc_id})`);
                addLog(`   Title: ${title}`);
                addLog(`   Body: ${body.substring(0, 80)}...`);
                
                const result = await sendToOneSignal(member.jc_id, title, body);
                
                if (result && result.id) {
                    sentCount++;
                    addLog(`   ‚úÖ Sent! ID: ${result.id}`);
                } else {
                    failCount++;
                    addLog(`   ‚ùå Failed: ${JSON.stringify(result)}`, true);
                }
                
                await new Promise(r => setTimeout(r, 500));
            }
            
            statsElement.innerHTML = `
                Ì≥ä <strong>SUMMARY:</strong><br>
                ‚úÖ Sent: ${sentCount} members<br>
                ‚ùå Failed: ${failCount} members<br>
                Ì≥± Total push-enabled: ${members.filter(m => m.push_enabled === true).length}
            `;
            
            addLog(`‚úÖ Complete! Sent to ${sentCount}, failed ${failCount}`);
            
        } catch (error) {
            addLog(`‚ùå Supabase error: ${error.message}`, true);
        }
    }
    
    sendPersonalizedNotifications();
    </script>
</body>
</html>
