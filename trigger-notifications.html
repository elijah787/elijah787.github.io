    function addLog(message) {
        const log = document.getElementById('log');
        const timestamp = new Date().toLocaleString();
        log.innerHTML += `\n[${timestamp}] ${message}`;
        log.scrollTop = log.scrollHeight;
        console.log(message);
    }

    async function sendNotification(title, body) {
        try {
            addLog(`Ì≥§ Sending: "${title}"`);
            
            const response = await fetch('https://onesignal.com/api/v1/notifications', {
                method: 'POST',
                headers: {
                    'Content-Type': 'application/json',
                    'Authorization': 'Basic ' + btoa(ONESIGNAL_API_KEY)
                },
                body: JSON.stringify({
                    app_id: ONESIGNAL_APP_ID,
                    headings: { en: title },
                    contents: { en: body },
                    included_segments: ['Subscribed Users'],
                    priority: 10,
                    ttl: 86400,
                    chrome_web_icon: 'https://i.ibb.co/rKnKMscG/67556a31-02c7-4182-a1d8-c12667bd7136.jpg'
                })
            });
            
            const result = await response.json();
            if (result.id) {
                addLog(`‚úÖ SENT! ID: ${result.id}`);
            } else {
                addLog(`‚ö†Ô∏è Response: ${JSON.stringify(result)}`);

            return result;
        } catch (error) {

    // 30-MINUTE SCHEDULE - ONLY SARCASTIC/WITTY MESSAGES
    let lastSentSlot = -1;

    async function runEvery30Minutes() {
        const now = new Date();
        const hour = now.getHours();
        const minute = now.getMinutes();
        const currentSlot = Math.floor(minute / 30);
        
        // Check if we already sent this slot
        if (lastSentSlot === currentSlot && lastSentSlot !== -1) {
            return;
        }
        
        addLog(`‚è∞ 30-MINUTE TRIGGER at ${hour}:${minute}`);
        
        // Pick a random sarcastic message
        const randomMsg = SARCASTIC_MESSAGES[Math.floor(Math.random() * SARCASTIC_MESSAGES.length)];
        
        addLog(`Ì≤Ä Selected: "${randomMsg.title}"`);
        await sendNotification(randomMsg.title, randomMsg.body);
        
        lastSentSlot = currentSlot;
        addLog(`‚úÖ Next sarcastic notification in 30 minutes`);
    }

    // Run immediately and then every 30 minutes
    setTimeout(runEvery30Minutes, 1000);
    setInterval(runEvery30Minutes, 30 * 60 * 1000);
