<!DOCTYPE html>
<html>
<head>
    <meta charset="UTF-8">
    <title>Jeans Club - Personalized Notifications</title>
    <style>
        body { background: #0a0a0a; color: #00ff00; font-family: monospace; padding: 20px; }
        pre { background: #1a1a1a; padding: 15px; border-radius: 5px; overflow-x: auto; font-size: 12px; }
        .stats { background: #1a1a1a; padding: 10px; border-radius: 5px; margin: 10px 0; }
    </style>
</head>
<body>
    <h1>Ì±ñ Jeans Club - Personalized Notifications</h1>
    <div class="stats" id="stats">Loading member data from Supabase...</div>
    <pre id="log">Starting...</pre>

    <script>
    const SUPABASE_URL = 'https://uoyzsyxjrfygrsfzhlao.supabase.co';
    const SUPABASE_ANON_KEY = 'eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6InVveXpzeXhqcmZ5Z3JzZnpobGFvIiwicm9sZSI6ImFub24iLCJpYXQiOjE3NjQxMDA0OTAsImV4cCI6MjA3OTY3NjQ5MH0.XOVNKt2JoLsjakjarq_wdt-PQKBI-8HpyBZmQZpznac';
    
    const ONESIGNAL_APP_ID = '40cfbe3f-800c-4105-b3aa-ca32676332b0';
    const ONESIGNAL_API_KEY = 'mnauelxvguqlmnyogt55cfj6u';
    
    const logElement = document.getElementById('log');
    const statsElement = document.getElementById('stats');
    
    function addLog(msg, isError = false) {
        const timestamp = new Date().toLocaleString();
        const color = isError ? '#ff4444' : '#00ff00';
        logElement.innerHTML += `<div style="color: ${color};">[${timestamp}] ${msg}</div>`;
        logElement.scrollTop = logElement.scrollHeight;
        console.log(msg);
    }
    
    // Generate PERSONALIZED message based on member data
    function generatePersonalizedMessage(member) {
        const name = member.name.split(' ')[0];
        const points = member.points || 0;
        const totalSpent = member.total_spent || 0;
        const tier = member.tier || 'PEARL';
        const daysInactive = member.last_login ? Math.floor((Date.now() - new Date(member.last_login)) / (1000 * 60 * 60 * 24)) : 999;
        
        // TIER-BASED SARCASM
        const tierMessages = {
            'PLATINUM': `Ì±ë Oh look, ${name} the PLATINUM has arrived! Your highness, care to buy more jeans? Your throne is getting lonely.`,
            'SAPPHIRE': `Ì≤é ${name}, you're SAPPHIRE! That's just a fancy way of saying "spends too much on jeans." We respect that.`,
            'GOLD': `Ìµá ${name} is GOLD! Not Olympic gold, just "broke-but-stylish" gold. Still counts!`,
            'RUBY': `‚ù§Ô∏è ${name} hit RUBY! Your wallet is bleeding, but at least you look good doing it.`,
            'SILVER': `Ìµà ${name}, you're SILVER. That's just a nicer word for "getting there... slowly."`,
            'BRONZE': `Ìµâ ${name} is BRONZE! The participation trophy of jeans buying. Step it up!`,
            'PEARL': `Ì∂™ ${name}, you're a PEARL. That's just a fancy rock. Spend more to become an actual gem.`
        };
        
        // POINTS-BASED TEASING
        let pointsMessage = '';
        if (points >= 500) {
            pointsMessage = `Ì≤∞ Points HOARDER! ${name} has ${points} points burning a hole in their pocket. Spend them before we donate them to charity (jk... unless?).`;
        } else if (points >= 200) {
            pointsMessage = `Ì≤∏ ${name} has ${points} points. That's like... 10,000 UGX discount. Not bad, not great. Middle child energy.`;
        } else if (points >= 50) {
            pointsMessage = `‚ö†Ô∏è ${name}, you have ${points} points. That's cute. Almost enough to buy... nothing. Keep shopping.`;
        } else if (points < 50 && points > 0) {
            pointsMessage = `Ì¥° ${name} has ${points} points. That's embarrassing. Did you even try? The circus is disappointed.`;
        } else {
            pointsMessage = `Ì≤Ä ${name} has ZERO points. How? Why? We're not mad, just disappointed. Go spend something.`;
        }
        
        // SPENDING-BASED ROASTING
        let spendingMessage = '';
        if (totalSpent >= 1000000) {
            spendingMessage = `Ì≤∞ MILLIONAIRE ALERT! ${name} has spent ${(totalSpent/1000).toFixed(0)}K UGX on jeans. Your wallet is crying. We're laughing.`;
        } else if (totalSpent >= 500000) {
            spendingMessage = `Ì≤™ ${name} spent ${(totalSpent/1000).toFixed(0)}K UGX. That's... respectable. Your bank account is concerned but impressed.`;
        } else if (totalSpent >= 100000) {
            spendingMessage = `Ì≥â ${name} spent ${(totalSpent/1000).toFixed(0)}K UGX. Rookie numbers. Call us when you hit 500K.`;
        } else if (totalSpent > 0) {
            spendingMessage = `Ì∂ê ${name} spent only ${(totalSpent/1000).toFixed(0)}K UGX. That's shrimp change. The big spenders are laughing at you.`;
        } else {
            spendingMessage = `ÌΩø ${name} has spent ZERO UGX. Are you even a member or just here for the free entertainment? Buy something.`;
        }
        
        // INACTIVITY SHAMING
        let inactivityMessage = '';
        if (daysInactive > 60) {
            inactivityMessage = `Ì≤Ä ${name}, it's been ${daysInactive} days! We thought you died. Your jeans are planning a funeral for your style. Come back!`;
        } else if (daysInactive > 30) {
            inactivityMessage = `Ì±ª ${name}, ${daysInactive} days? Ghosting us? Your jeans miss you. We miss your money. Come back.`;
        } else if (daysInactive > 14) {
            inactivityMessage = `‚è∞ ${name}, ${daysInactive} days no purchase. Your style is getting dusty. Time for a refresh.`;
        }
        
        // Combine messages based on what's relevant
        let finalMessage = '';
        
        if (daysInactive > 30) {
            finalMessage = inactivityMessage;
        } else if (points === 0 && totalSpent === 0) {
            finalMessage = `Ì¥° HEY ${name.toUpperCase()}! You joined and did NOTHING. What's the point? Buy jeans or we're revoking your membership. Ì±ñ`;
        } else if (totalSpent >= 1000000) {
            finalMessage = `${tierMessages[tier]} ${spendingMessage}`;
        } else if (points >= 200) {
            finalMessage = `${pointsMessage} ${tierMessages[tier]}`;
        } else {
            finalMessage = `${spendingMessage} ${pointsMessage}`;
        }
        
        return {
            title: getTitleForMember(member, points, totalSpent),
            body: finalMessage.substring(0, 200) // Max length
        };
    }
    
    function getTitleForMember(member, points, totalSpent) {
        const name = member.name.split(' ')[0];
        
        if (member.tier === 'PLATINUM') return `Ì±ë PLATINUM ROYALTY: ${name}`;
        if (totalSpent >= 1000000) return `Ì≤∞ MILLIONAIRE ALERT: ${name}`;
        if (points >= 500) return `Ì≤é POINTS HOARDER: ${name}`;
        if (points === 0 && totalSpent === 0) return `Ì¥° DO SOMETHING: ${name}`;
        if (points < 50) return `‚ö†Ô∏è BROKE ALERT: ${name}`;
        
        const sarcasticTitles = [
            `Ì≤Ä ${name}, we need to talk`,
            `Ì¥° CLOWN OF THE DAY: ${name}`,
            `Ì≥â FINANCIAL DISASTER: ${name}`,
            `Ìæ™ CIRCUS MEMBER: ${name}`,
            `Ì≤∏ POVERTY UPDATE: ${name}`
        ];
        
        return sarcasticTitles[Math.floor(Math.random() * sarcasticTitles.length)];
    }
    
    async function sendToOneSignal(externalUserId, title, body) {
        try {
            const response = await fetch('https://onesignal.com/api/v1/notifications', {
                method: 'POST',
                headers: {
                    'Content-Type': 'application/json',
                    'Authorization': 'Basic ' + btoa(ONESIGNAL_API_KEY)
                },
                body: JSON.stringify({
                    app_id: ONESIGNAL_APP_ID,
                    headings: { en: title },
                    contents: { en: body },
                    include_external_user_ids: [externalUserId],
                    priority: 10,
                    ttl: 86400,
                    chrome_web_icon: 'https://i.ibb.co/rKnKMscG/67556a31-02c7-4182-a1d8-c12667bd7136.jpg'
                })
            });
            return await response.json();
        } catch (error) {
            return null;
        }
    }
    
    async function sendPersonalizedNotifications() {
        addLog('ÌæØ Fetching members from Supabase...');
        
        try {
            // Get ALL members from Supabase
            const response = await fetch(`${SUPABASE_URL}/rest/v1/members?select=*`, {
                headers: {
                    'apikey': SUPABASE_ANON_KEY,
                    'Authorization': `Bearer ${SUPABASE_ANON_KEY}`
                }
            });
            
            const members = await response.json();
            addLog(`Ì≥ä Found ${members.length} members in Supabase`);
            
            let sentCount = 0;
            let failCount = 0;
            
            statsElement.innerHTML = `
                Ì≥ä <strong>Supabase Members:</strong> ${members.length}<br>
                Ì≥± <strong>Sending personalized notifications...</strong>
            `;
            
            for (const member of members) {
                // Only send to members with push_enabled = true
                if (member.push_enabled !== true) {
                    addLog(`‚è≠Ô∏è Skipping ${member.name} (push not enabled)`);
                    continue;
                }
                
                const { title, body } = generatePersonalizedMessage(member);
                addLog(`Ì≥§ Sending to ${member.name} (${member.jc_id})`);
                addLog(`   Title: ${title}`);
                addLog(`   Body: ${body.substring(0, 80)}...`);
                
                const result = await sendToOneSignal(member.jc_id, title, body);
                
                if (result && result.id) {
                    sentCount++;
                    addLog(`   ‚úÖ Sent! ID: ${result.id}`);
                } else {
                    failCount++;
                    addLog(`   ‚ùå Failed: ${JSON.stringify(result)}`, true);
                }
                
                // Small delay to avoid rate limiting
                await new Promise(r => setTimeout(r, 500));
            }
            
            statsElement.innerHTML = `
                Ì≥ä <strong>SUMMARY:</strong><br>
                ‚úÖ Sent: ${sentCount} members<br>
                ‚ùå Failed: ${failCount} members<br>
                ÌæØ Total processed: ${members.filter(m => m.push_enabled === true).length} push-enabled members
            `;
            
            addLog(`‚úÖ Complete! Sent to ${sentCount} members, failed ${failCount}`);
            
        } catch (error) {
            addLog(`‚ùå Supabase error: ${error.message}`, true);
        }
    }
    
    // Run immediately
    sendPersonalizedNotifications();
    </script>
</body>
</html>
