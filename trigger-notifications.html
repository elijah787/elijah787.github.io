<!DOCTYPE html>
<html>
<head>
    <meta charset="UTF-8">
    <title>Jeans Club Notification Trigger</title>
    <style>
        body {
            font-family: monospace;
            background: #0a0a0a;
            color: #00ff00;
            padding: 20px;
        }
        .log {
            background: #1a1a1a;
            padding: 15px;
            border-radius: 5px;
            white-space: pre-wrap;
            font-size: 12px;
        }
    </style>
</head>
<body>
    <h1>Ì±ñ Jeans Club Notification Service</h1>
    <p>Status: <span id="status">Ìø¢ RUNNING</span></p>
    <div class="log" id="log">Initializing...</div>

    <script>
    const ONESIGNAL_APP_ID = '40cfbe3f-800c-4105-b3aa-ca32676332b0';
    const ONESIGNAL_API_KEY = 'os_v2_app_idh34p4abraqlm5kzizgoyzswb4xhwz45qnu6du72szadwuaxglazhrzdezgl7xoat43nps2nojsz4j3kypjqxpty3sj7ohgi2aihki';

    const DARK_MESSAGES = [
        { title: "Ì≤Ä Existential Crisis", body: "Your jeans will outlive you. Make sure they're stylish ones. Ì±ñ" },
        { title: "Ì¥Æ Your Future", body: "I see jeans in your future. And debt. Mostly debt. Worth it though!" },
        { title: "‚ö∞Ô∏è Breaking News", body: "Local person spends money they don't have on jeans they don't need. More at 11." },
        { title: "Ì±ª Spooky Fact", body: "Your money isn't gone... it's just... fashionably late. Forever." },
        { title: "Ì¥° Clown Update", body: "You're one step closer to looking like a million bucks. Too bad you spent it all on jeans." },
        { title: "Ì≥â Financial Advice", body: "Money can't buy happiness. But it can buy jeans. That's basically the same thing." },
        { title: "ÌΩ∑ Poor Decisions", body: "Every great love story starts with a bad decision. These jeans are your soulmate." },
        { title: "Ìæ™ Circus Alert", body: "Your financial literacy left the chat. But your drip? IMMACULATE." },
        { title: "Ì∫¶ Epitaph", body: "Here lies your savings. Cause of death: 'But they were on sale!'" },
        { title: "Ì≥¢ PSA", body: "Warning: Excessive denim consumption may lead to happiness, confidence, and bankruptcy." }
    ];

    function addLog(message) {
        const log = document.getElementById('log');
        const timestamp = new Date().toLocaleString();
        log.innerHTML += `\\n[${timestamp}] ${message}`;
        log.scrollTop = log.scrollHeight;
        console.log(message);
    }

    async function sendNotification(title, body) {
        try {
            addLog(`Ì≥§ Sending: "${title}"`);
            
            const response = await fetch('https://onesignal.com/api/v1/notifications', {
                method: 'POST',
                headers: {
                    'Content-Type': 'application/json',
                    'Authorization': 'Basic ' + btoa(ONESIGNAL_API_KEY)
                },
                body: JSON.stringify({
                    app_id: ONESIGNAL_APP_ID,
                    headings: { en: title },
                    contents: { en: body },
                    included_segments: ['Subscribed Users'],
                    priority: 10,
                    ttl: 86400,
                    chrome_web_icon: 'https://i.ibb.co/rKnKMscG/67556a31-02c7-4182-a1d8-c12667bd7136.jpg'
                })
            });
            
            const result = await response.json();
            addLog(`‚úÖ Sent! Notification ID: ${result.id || 'Success'}`);
            return result;
        } catch (error) {
            addLog(`‚ùå Error: ${error.message}`);
            return null;
        }
    }

    async function runScheduledNotifications() {
        const now = new Date();
        const hour = now.getHours();
        const day = now.getDay();
        
        addLog(`Ìµê Checking schedule - Hour: ${hour}, Day: ${day}`);
        
        // DAILY DARK HUMOR (9 AM)
        if (hour === 9) {
            const randomMsg = DARK_MESSAGES[Math.floor(Math.random() * DARK_MESSAGES.length)];
            await sendNotification(randomMsg.title, randomMsg.body);
        }
        
        // WEEKEND SPECIAL (Sat/Sun 10 AM)
        if ((day === 6 || day === 0) && hour === 10) {
            await sendNotification('Ìæâ WEEKEND DENIM SPECIAL! Ìæâ', 'Double points on all purchases TODAY ONLY! Show this notification at checkout. Ì±ñ');
        }
        
        // MIDNIGHT RESET (12 AM)
        if (hour === 0) {
            await sendNotification('Ìºô Midnight Denim Thoughts...', 'New day, new jeans! Your daily points have been refreshed. Shop now!');
        }
        
        // BIRTHDAY CHECK (8 AM)
        if (hour === 8) {
            await sendNotification('ÌæÇ BIRTHDAY BONUS! ÌæÇ', 'Is it your birthday? Get 200 FREE points! Show your ID at checkout. Valid today only!');
        }
        
        // LOW POINTS REMINDER (3 PM)
        if (hour === 15) {
            await sendNotification('‚ö†Ô∏è LOW POINTS ALERT!', 'Check your points balance. Shop now to earn more and unlock bigger discounts!');
        }
        
        // FLASH SALE (6 PM)
        if (hour === 18) {
            await sendNotification('‚ö° FLASH SALE! ‚ö°', 'Next 2 hours: 20% OFF everything! Use code: FLASH20 at checkout.');
        }
        
        addLog('‚úÖ Schedule check complete');
    }

    // Run immediately when triggered
    runScheduledNotifications();
    
    // Also run every hour if page stays open
    setInterval(runScheduledNotifications, 60 * 60 * 1000);
    
    addLog('Ì∫Ä Notification service ready!');
    </script>
</body>
</html>
